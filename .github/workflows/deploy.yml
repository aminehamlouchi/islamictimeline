name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pushes to main share one queue so deployments land in order. A pull request
# runs in its own group, keyed on its ref, so it never waits behind a
# deployment, and a newer push to the same pull request cancels the older run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_PUBLIC_BASE_PATH: /islamictimeline
  NEXT_PUBLIC_SITE_URL: https://aminehamlouchi.com/islamictimeline

jobs:
  verify:
    name: Checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Size budget
        run: node scripts/size-budget.mjs
      - name: Internal link check
        run: node scripts/link-check.mjs
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Lighthouse mobile scores for /
        # A printed score, not a gate: shared runners are too noisy for a
        # Performance threshold. The four numbers are in this step's log.
        continue-on-error: true
        run: |
          node scripts/serve-out.mjs &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4321/islamictimeline/ > /dev/null && break
            sleep 1
          done
          npx --yes lighthouse@12 http://127.0.0.1:4321/islamictimeline/ \
            --form-factor=mobile \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path="$RUNNER_TEMP/lighthouse.json" \
            --chrome-flags="--headless=new --no-sandbox" \
            --quiet
          node -e '
            const c = require(process.env.RUNNER_TEMP + "/lighthouse.json").categories;
            for (const k of ["performance", "accessibility", "best-practices", "seo"])
              console.log(c[k].title.padEnd(16) + Math.round(c[k].score * 100));
          '
      - name: Path independence and interaction smoke
        id: e2e
        run: npx playwright test
      - name: Keep the traces and screenshots of the failed run
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
